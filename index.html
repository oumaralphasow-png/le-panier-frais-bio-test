<!doctype html><html lang=fr><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Le Panier Frais Bio — Connexion V46</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f0e3;color:#17392a;font:14px system-ui}header{background:#174b35;color:#fff;padding:20px 5%}main{max-width:900px;margin:auto;padding:24px}.c{background:#fffdf8;padding:18px;border-radius:14px;margin:12px 0}.ok{color:#28623d;font-weight:800}.bad{color:#a13a35;font-weight:800}input{padding:10px;border:1px solid #bdc8c0;border-radius:8px;width:100%;margin:6px 0}button{border:0;background:#174b35;color:#fff;padding:10px 12px;border-radius:8px;font-weight:800;margin:4px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.hidden{display:none}.log{background:#13271d;color:white;padding:10px;border-radius:8px;min-height:90px;font:12px monospace}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
<header><b>LE PANIER FRAIS BIO</b><br>Authentification réelle + rôles — V46</header>
<main>
<div class=c id=loginBox><b>Connexion</b>
<input id=email value="admin@lpfb.test" placeholder="Email">
<input id=password type=password value="LPFB-Test-2026!" placeholder="Mot de passe">
<button onclick=login()>Se connecter</button>
<p id=loginMsg></p>
<p><small>Compte de test : admin@lpfb.test / LPFB-Test-2026! — à modifier avant production.</small></p>
</div>

<div id=appBox class=hidden>
<div class="grid">
<div class=c><b>Session</b><p id=who></p><button onclick=me()>Vérifier session</button><button onclick=logout()>Déconnexion</button></div>
<div class=c><b>Tests de permissions</b><button onclick="secure('/admin/secure')">Admin</button><button onclick="secure('/production/secure')">Production</button><button onclick="secure('/delivery/secure')">Livraison</button></div>
</div>
<div class=c><b>Journal</b><div id=log class=log></div></div>
</div>
<script>
let token=localStorage.getItem('lpfb_token')||'';
function lg(x){log.innerHTML="["+new Date().toLocaleTimeString("fr-FR")+"] "+x+"<br>"+log.innerHTML}
async function api(url,opt={}){opt.headers=opt.headers||{};if(token)opt.headers.Authorization='Bearer '+token;if(opt.body)opt.headers['Content-Type']='application/json';let r=await fetch(url,opt);let d=await r.json().catch(()=>({}));if(!r.ok)throw {status:r.status,data:d};return d}
async function login(){try{let d=await api('/auth/login',{method:'POST',body:JSON.stringify({email:email.value,password:password.value})});token=d.access_token;localStorage.setItem('lpfb_token',token);loginMsg.innerHTML='<span class=ok>Connexion réussie.</span>';loginBox.classList.add('hidden');appBox.classList.remove('hidden');who.textContent=d.name+' · '+d.role;lg("LOGIN_SUCCESS "+d.role)}catch(e){loginMsg.innerHTML='<span class=bad>Connexion refusée.</span>'}}
async function me(){try{let d=await api('/auth/me');who.textContent=d.full_name+' · '+d.role;lg("SESSION_OK "+d.email)}catch(e){lg("SESSION_ERROR "+e.status)}}
async function secure(url){try{let d=await api(url);lg(d.message)}catch(e){lg("ACCÈS REFUSÉ "+e.status+" "+(e.data.detail||''))}}
function logout(){token='';localStorage.removeItem('lpfb_token');appBox.classList.add('hidden');loginBox.classList.remove('hidden')}
if(token){loginBox.classList.add('hidden');appBox.classList.remove('hidden');me()}
</script></main></html>
