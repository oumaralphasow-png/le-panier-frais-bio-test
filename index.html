<!doctype html><html lang=fr><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1">
<title>Le Panier Frais Bio — Interface Test V45</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f0e3;color:#17392a;font:14px system-ui}
header{background:#174b35;color:#fff;padding:20px 5%}main{max-width:1180px;margin:auto;padding:20px}
.k{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.m,.c{background:#fffdf8;padding:14px;border-radius:13px}
.m{background:#e5eee5}.big{font-size:21px;font-weight:900}.g{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:14px}
.row{padding:10px;background:#eff3ed;border-radius:9px;margin:7px 0}.ok{color:#28623d;font-weight:800}.bad{color:#a13a35;font-weight:800}
button{border:0;background:#174b35;color:white;padding:9px 11px;border-radius:8px;font-weight:800;margin:3px}
input,select{padding:9px;border:1px solid #bdc8c0;border-radius:8px}.log{height:190px;overflow:auto;background:#13271d;color:#fff;padding:9px;border-radius:8px;font:11px monospace}
@media(max-width:800px){.g{grid-template-columns:1fr}.k{grid-template-columns:1fr 1fr}}
</style>
<header><b>LE PANIER FRAIS BIO</b><br>Interface de test connectée au backend — V45</header>
<main>
<div class=k><div class=m>API<div class="big ok" id=api>...</div></div><div class=m>Produits<div class=big id=products>0</div></div><div class=m>Lots<div class=big id=lotsCount>0</div></div><div class=m>Commandes<div class=big id=ordersCount>0</div></div></div>
<div class=g><section>
<div class=c><b>Créer une commande réelle dans la base locale</b><p><select id=clientType><option>PRO</option><option>B2C</option></select> <input id=client value="Restaurant Démo" placeholder="Client"></p><p><select id=product></select> <input id=qty type=number min=0.1 step=0.1 value=5> kg</p><button onclick=createOrder()>Valider la commande</button><p id=msg></p></div>
<div class=c><b>Lots / stock</b><div id=lots></div></div>
</section><section>
<div class=c><b>Commandes</b><div id=orders></div></div>
<div class=c><b>Journal API</b><div id=log class=log></div></div>
</section></div>
<script>
async function j(url,opt){let r=await fetch(url,opt);let data=await r.json().catch(()=>({}));if(!r.ok)throw {status:r.status,data};return data}
function lg(x){log.innerHTML="<div>["+new Date().toLocaleTimeString("fr-FR")+"] "+x+"</div>"+log.innerHTML}
async function refresh(){
 try{
  let h=await j('/health'); api.textContent="OK";
  let p=await j('/products'), l=await j('/lots'), o=await j('/orders');
  products.textContent=p.length; lotsCount.textContent=l.length; ordersCount.textContent=o.length;
  product.innerHTML=p.map(x=>`<option value="${x.id}">${x.name}</option>`).join("");
  lots.innerHTML=l.map(x=>`<div class=row><b>${x.internal_lot}</b> · ${x.name}<br>${x.status} · reçu ${x.qty_received} · réservé ${x.qty_reserved} · <b>dispo ${x.qty_available}</b></div>`).join("");
  orders.innerHTML=o.length?o.map(x=>`<div class=row><b>#${x.id}</b> ${x.client_type} · ${x.client_name}<br>${x.product_name} · ${x.quantity} · ${x.status}<br><button onclick="cancelOrder(${x.id})">Annuler</button></div>`).join(""):"<p>Aucune commande.</p>";
 }catch(e){api.textContent="ERREUR";api.className="big bad";lg("Erreur de chargement API");}
}
async function createOrder(){
 msg.innerHTML="";
 try{
  let body={client_type:clientType.value,client_name:client.value,product_id:+product.value,quantity:+qty.value};
  let r=await j('/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  msg.innerHTML='<span class=ok>Commande #'+r.order_id+' créée et stock réservé.</span>';lg("ORDER_CREATED #"+r.order_id);refresh();
 }catch(e){msg.innerHTML='<span class=bad>Erreur '+e.status+' : '+JSON.stringify(e.data.detail||e.data)+'</span>';lg("ORDER_ERROR "+e.status)}
}
async function cancelOrder(id){
 try{await j('/orders/'+id+'/cancel',{method:'POST'});lg("ORDER_CANCELLED #"+id);refresh()}catch(e){lg("CANCEL_ERROR "+e.status)}
}
refresh();lg("Interface V45 chargée.");
</script></main></html>
