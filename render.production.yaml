services:
  - type: web
    name: le-panier-frais-bio
    runtime: docker
    healthCheckPath: /health/ready
    preDeployCommand: python -m alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: SEED_DEMO_DATA
        value: "false"
      - key: PRODUCTION_STRICT
        value: "true"
      - key: AUTO_CREATE_SCHEMA
        value: "false"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: le-panier-frais-bio-db
          property: connectionString
      - key: ALLOWED_ORIGINS
        value: https://lepanierfraisbio.fr,https://www.lepanierfraisbio.fr
      - key: SITE_URL
        value: https://lepanierfraisbio.fr
      - key: BOOTSTRAP_ADMIN_EMAIL
        value: oumar.alpha.sow@hotmail.fr
      - key: BOOTSTRAP_ADMIN_PASSWORD
        sync: false
      - key: BOOTSTRAP_ADMIN_NAME
        value: Administrateur Le Panier Frais Bio
      - key: SUPPORT_EMAIL
        value: ""
      - key: SUPPORT_PHONE
        value: ""
      - key: TOKEN_TTL_MINUTES
        value: "480"
      - key: RELEASE_CHANNEL
        value: stable

databases:
  - name: le-panier-frais-bio-db
    plan: free
